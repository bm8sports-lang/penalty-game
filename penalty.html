<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>点球大战</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#1b4020; font-family:'Segoe UI',Arial,sans-serif; user-select:none; color:#fff; }
    #c { display:block; transform-origin:center; }
    body.shot-shake #c { animation:shotShake .22s ease-out; }
    @keyframes shotShake {
      0%,100% { transform:translate3d(0,0,0); }
      22% { transform:translate3d(-5px,3px,0); }
      45% { transform:translate3d(4px,-2px,0); }
      68% { transform:translate3d(-2px,1px,0); }
    }
    .brandTag { position:fixed; top:14px; left:16px; z-index:12; display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:rgba(9,31,38,.66); border:1px solid rgba(255,255,255,.20); box-shadow:0 10px 24px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter:blur(10px); font-size:12px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; }
    .brandDot { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(180deg,#ffe86b,#ff8f00); color:#1c1700; box-shadow:0 0 16px rgba(255,214,0,.45); }
    .hud { position:fixed; top:14px; right:70px; display:flex; gap:12px; background:linear-gradient(180deg,rgba(15,27,18,.72),rgba(5,10,8,.50)); backdrop-filter:blur(10px); padding:7px 14px; border-radius:999px; color:#fff; z-index:10; border:1px solid rgba(255,255,255,.14); box-shadow:0 12px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12); }
    .hi { display:flex; flex-direction:column; align-items:center; gap:1px; }
    .hl { font-size:10px; color:rgba(255,255,255,.45); text-transform:uppercase; letter-spacing:.06em; }
    .hv { font-size:22px; font-weight:800; line-height:1; }
    #statusMsg { position:fixed; top:42%; left:50%; transform:translate(-50%,-50%) scale(.92); font-size:42px; font-weight:950; color:#fff; text-shadow:0 3px 20px rgba(0,0,0,.85),0 0 22px currentColor; pointer-events:none; z-index:10; opacity:0; transition:opacity .2s,transform .2s; white-space:nowrap; letter-spacing:0; }
    #statusMsg.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
    #statusMsg.show.goal-pop { animation:msgPop .42s cubic-bezier(.16,1.4,.34,1); }
    #statusMsg.show.save-pop { animation:msgPop .34s cubic-bezier(.16,1.25,.34,1); }
    @keyframes msgPop { from { transform:translate(-50%,-50%) scale(.72); filter:blur(2px); } }
    #streakBadge { position:fixed; top:76px; left:50%; transform:translateX(-50%); font-size:16px; font-weight:800; color:#ffd54f; text-shadow:0 2px 8px rgba(0,0,0,.7); z-index:10; }
    .multiplierRail { position:fixed; top:88px; left:50%; transform:translateX(-50%); width:min(540px,74vw); z-index:11; display:grid; grid-template-columns:repeat(5,1fr); align-items:center; gap:0; pointer-events:none; }
    .multiplierRail::before { content:""; position:absolute; left:8%; right:8%; top:50%; height:4px; transform:translateY(-50%); background:linear-gradient(90deg,rgba(255,255,255,.36),rgba(255,255,255,.60)); border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.32); }
    .multStep { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; color:#fff; font-size:11px; font-weight:900; text-shadow:0 2px 6px rgba(0,0,0,.72); }
    .multStep::before { content:""; width:14px; height:14px; border-radius:50%; background:#f4f8ff; border:2px solid rgba(0,0,0,.20); box-shadow:0 2px 8px rgba(0,0,0,.32); }
    .multStep.active::before { width:20px; height:20px; background:#ffd54f; box-shadow:0 0 0 5px rgba(255,213,79,.18),0 0 22px rgba(255,213,79,.9); }
    .multStep.won::before { background:#00e676; box-shadow:0 0 18px rgba(0,230,118,.78); }
    .multStep.lost::before { background:#ff5252; box-shadow:0 0 16px rgba(255,82,82,.72); }
    .pips { position:fixed; bottom:86px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:10; }
    .pip { width:17px; height:17px; border-radius:50%; border:2.5px solid rgba(255,255,255,.45); background:transparent; transition:background .3s,border-color .3s; }
    .pip.goal { background:#00e676; border-color:#00e676; }
    .pip.miss { background:#ff5252; border-color:#ff5252; }
    #shotLabel { position:fixed; bottom:111px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.78); font-size:12px; font-weight:800; z-index:10; text-shadow:0 2px 6px rgba(0,0,0,.70); }
    #aimHint   { position:fixed; bottom:136px; left:50%; transform:translateX(-50%); color:#fff; font-size:14px; font-weight:900; letter-spacing:.04em; text-shadow:0 2px 9px rgba(0,0,0,.9); pointer-events:none; z-index:10; background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.25)); border:1px solid rgba(255,255,255,.20); border-radius:999px; padding:8px 15px; backdrop-filter:blur(5px); }
    #musicBtn  { position:fixed; top:14px; right:16px; width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.55); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.15); color:#fff; font-size:20px; cursor:pointer; z-index:11; display:flex; align-items:center; justify-content:center; transition:background .2s; user-select:none; }
    #musicBtn:hover { background:rgba(0,0,0,.75); }
    .controlBar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:12; width:min(760px,calc(100vw - 24px)); min-height:62px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; padding:10px 14px; background:linear-gradient(180deg,rgba(78,36,18,.86),rgba(50,20,10,.84)); border:1px solid rgba(255,255,255,.18); border-radius:18px; box-shadow:0 18px 40px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter:blur(12px); }
    .betBox,.balanceBox { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .balanceBox { text-align:right; align-items:flex-end; }
    .barLabel { font-size:10px; color:rgba(255,255,255,.56); font-weight:900; letter-spacing:.10em; text-transform:uppercase; }
    .barValue { font-size:18px; color:#fff; font-weight:950; line-height:1; text-shadow:0 2px 8px rgba(0,0,0,.45); }
    .betControls { display:flex; align-items:center; gap:8px; margin-top:4px; }
    .miniBtn { width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.28); color:#fff; font-size:17px; font-weight:900; cursor:pointer; display:grid; place-items:center; }
    .collectBtn { min-width:106px; height:42px; border:0; border-radius:999px; background:linear-gradient(180deg,#ffffff,#d9fff0 46%,#00c853 47%,#009624); color:#06240e; font-size:14px; font-weight:950; letter-spacing:.03em; box-shadow:0 0 20px rgba(0,230,118,.34), inset 0 1px 0 rgba(255,255,255,.85); }
    .collectBtn:disabled { filter:saturate(.45); opacity:.72; }
    .overlay { display:none; position:fixed; inset:0; background:radial-gradient(circle at 50% 35%,rgba(255,214,0,.14),rgba(0,0,0,.78) 52%,rgba(0,0,0,.86)); z-index:50; align-items:center; justify-content:center; padding:20px; }
    .overlay.open { display:flex; }
    .modal { background:linear-gradient(180deg,rgba(24,43,29,.96),rgba(8,18,14,.96)); border-radius:18px; padding:38px 48px; text-align:center; color:#fff; min-width:300px; box-shadow:0 26px 70px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.14); animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
    @keyframes popIn { from { transform:scale(.65); opacity:0; } }
    .me { font-size:64px; margin-bottom:6px; }
    .mt { font-size:28px; font-weight:800; margin-bottom:6px; }
    .ms { font-size:18px; color:rgba(255,255,255,.65); margin-bottom:4px; }
    .mf { font-size:13px; color:rgba(255,255,255,.35); margin-bottom:24px; }
    .btn { padding:13px 36px; font-size:16px; font-weight:800; background:linear-gradient(180deg,#ffd54f,#f57f17); color:#1b1600; border:none; border-radius:999px; cursor:pointer; transition:filter .2s,transform .1s,box-shadow .2s; box-shadow:0 10px 22px rgba(245,127,23,.30), inset 0 1px 0 rgba(255,255,255,.55); }
    .btn:hover { filter:brightness(1.06); box-shadow:0 12px 26px rgba(245,127,23,.42), inset 0 1px 0 rgba(255,255,255,.65); }
    .btn:active { transform:scale(.96); }
    /* Loading screen */
    #loadScreen { position:fixed; inset:0; background:radial-gradient(circle at 50% 32%,rgba(255,213,79,.18),rgba(8,28,18,.78) 42%,#08140d 78%),linear-gradient(135deg,#133e24,#092017 48%,#32180c); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:999; overflow:hidden; text-align:center; padding:22px; }
    #loadScreen::before { content:""; position:absolute; inset:-15%; background:linear-gradient(115deg,transparent 0 42%,rgba(255,255,255,.08) 43% 44%,transparent 45% 100%); transform:rotate(-8deg); pointer-events:none; }
    #loadScreen.hidden { display:none; }
    .ls-kicker { position:relative; z-index:1; width:min(440px,92vw); display:flex; flex-direction:column; align-items:center; gap:14px; }
    .ls-title { font-size:clamp(38px,9vw,72px); line-height:.92; font-weight:950; text-transform:uppercase; letter-spacing:0; text-shadow:0 5px 28px rgba(0,0,0,.75); }
    .ls-sub { color:rgba(255,255,255,.72); font-size:15px; font-weight:700; letter-spacing:.04em; }
    .ls-ball { font-size:64px; animation:spin 1.2s linear infinite; filter:drop-shadow(0 10px 18px rgba(0,0,0,.36)); }
    @keyframes spin { to { transform:rotate(360deg); } }
    .ls-txt { color:#fff; font-size:18px; font-weight:600; letter-spacing:.08em; }
    .ls-bar { width:260px; height:6px; background:rgba(255,255,255,.15); border-radius:4px; overflow:hidden; }
    .ls-fill { height:100%; width:0%; background:#00e676; border-radius:4px; transition:width .2s; }
    .ls-hint { color:rgba(255,255,255,.48); font-size:12px; text-align:center; max-width:320px; line-height:1.6; }
    /* ── Mobile ──────────────────────────────────────────────────────────── */
    html,body { height:100%; }
    #c { touch-action:none; }
    @media (max-width:480px) {
      .brandTag { top:10px; left:10px; padding:7px 10px; font-size:10px; }
      .hud { gap:10px; padding:7px 11px; top:10px; right:56px; }
      .hl { font-size:9px; }
      .hv { font-size:18px; }
      #statusMsg { font-size:30px; top:40%; }
      .modal { padding:28px 24px; min-width:unset; width:88vw; }
      .mt { font-size:22px; } .ms { font-size:15px; }
      #streakBadge { top:62px; font-size:14px; }
      .multiplierRail { top:66px; width:88vw; }
      .multStep { font-size:10px; }
      #aimHint { bottom:124px; font-size:12px; padding:7px 12px; max-width:88vw; white-space:nowrap; }
      #shotLabel { bottom:101px; }
      .pips { bottom:76px; }
      .controlBar { grid-template-columns:1fr auto; grid-template-areas:"bet collect" "balance balance"; gap:8px 10px; padding:9px 11px; border-radius:15px; }
      .betBox { grid-area:bet; }
      .collectBtn { grid-area:collect; min-width:86px; height:38px; font-size:12px; }
      .balanceBox { grid-area:balance; text-align:left; align-items:flex-start; }
      .barValue { font-size:16px; }
      #musicBtn { top:10px; right:10px; width:38px; height:38px; }
    }
    @supports (padding: env(safe-area-inset-bottom)) {
      .pips    { bottom:calc(22px + env(safe-area-inset-bottom)); }
      #shotLabel { bottom:calc(47px + env(safe-area-inset-bottom)); }
      #aimHint   { bottom:calc(9% + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="brandTag"><span class="brandDot">⚽</span><span>Street Penalty</span></div>
<div id="loadScreen">
  <div class="ls-kicker">
    <div class="ls-ball">⚽</div>
    <div class="ls-title">点球大战</div>
    <div class="ls-sub">读懂门将，命中死角</div>
    <div class="ls-txt">加载资源中…</div>
    <div class="ls-bar"><div class="ls-fill" id="lsFill"></div></div>
    <div class="ls-hint" id="lsHint">如需使用自定义素材，请将图片放入 assets/ 文件夹<br>缺失图片将自动使用内置画面</div>
    <button class="btn" id="startBtn" style="display:none;margin-top:10px;font-size:18px;padding:14px 44px;">开始射门 ⚽</button>
  </div>
</div>
<div class="multiplierRail" id="multRail" aria-hidden="true"></div>
<div class="hud">
  <div class="hi"><span class="hl">本局进球</span><span class="hv" id="hGoals">0</span></div>
  <div class="hi"><span class="hl">连续</span><span class="hv" id="hStreak">0</span></div>
  <div class="hi"><span class="hl">最高</span><span class="hv" id="hBest">0</span></div>
</div>
<div id="streakBadge"></div>
<div id="statusMsg"></div>
<div id="shotLabel"></div>
<div class="pips" id="pips"></div>
<div id="aimHint">选择球门区域射门</div>
<button id="musicBtn" title="音乐 / Music">🔇</button>
<div class="controlBar">
  <div class="betBox">
    <span class="barLabel">BET</span>
    <span class="barValue" id="betValue">100.00</span>
    <div class="betControls">
      <button class="miniBtn" id="betDown" type="button" aria-label="减少下注">−</button>
      <button class="miniBtn" id="betUp" type="button" aria-label="增加下注">+</button>
    </div>
  </div>
  <button class="collectBtn" id="collectBtn" type="button" disabled>COLLECT</button>
  <div class="balanceBox">
    <span class="barLabel">DEMO BALANCE</span>
    <span class="barValue" id="balanceValue">1,000.00</span>
  </div>
</div>
<audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="me" id="mEmoji"></div><div class="mt" id="mTitle"></div>
    <div class="ms" id="mScore"></div><div class="mf" id="mFlavor"></div>
    <button class="btn" onclick="restart()">再来一局 ⚽</button>
  </div>
</div>
<script>
const c=document.getElementById('c'), ctx=c.getContext('2d');
const USE_STREET_CANVAS_SCENE=true;

// ── Image asset loader ─────────────────────────────────────────────────────
// Put your PNG files in  Desktop/assets/  next to penalty.html
// Each asset falls back to built-in canvas drawing if the file is missing.
const ASSET_SRC={
  bg:        'assets/bg.png',          // 1280×720  横屏背景（桌面用）
  bg_mobile: 'assets/bg_mobile.png',   // 750×1624  竖屏背景（手机用）
  ball:    'assets/ball.png',     // 256×256   足球，透明背景
  gk_idle: 'assets/gk_idle.png', // 220×440   门将待机，透明背景
  gk_left: 'assets/gk_dive_l.png',// 440×320  门将扑左，透明背景
  gk_right:'assets/gk_dive_r.png',// 440×320  门将扑右，透明背景（可水平翻转 gk_dive_l）
  gk_up_left: 'assets/gk_dive_ul.png',// 440×320 上左角飞扑（含斜度），透明背景
  gk_up_right:'assets/gk_dive_ur.png',// 440×320 上右角飞扑（含斜度），透明背景
  gk_up:   'assets/gk_up.png',   // 220×440   门将起跳，透明背景
  gk_bm8_sheet: 'assets/generated/gk_bm8_sheet.png',
};
const img={};
const bm8Frames={};
function loadAssets(done){
  const keys=Object.keys(ASSET_SRC), total=keys.length; let n=0;
  const fill=document.getElementById('lsFill'), hint=document.getElementById('lsHint');
  keys.forEach(k=>{
    const i=new Image();
    let settled=false;
    const finish=()=>{ if(settled)return; settled=true; img[k]=i.complete&&i.naturalWidth?i:null; n++;
      if(fill)fill.style.width=(n/total*100)+'%';
      if(hint)hint.textContent=`加载 ${n} / ${total}: ${k}`;
      if(n>=total)done(); };
    i.onload=finish; i.onerror=finish; i.src=ASSET_SRC[k];
    setTimeout(finish,3500);
  });
}

const BM8_FRAME_RECTS={
  idle:{x:22,y:48,w:360,h:390},
  crouch:{x:402,y:142,w:330,h:320},
  push_l:{x:755,y:48,w:360,h:410},
  fly_l_1:{x:1110,y:48,w:410,h:410},
  fly_l_2:{x:18,y:635,w:500,h:260},
  land_l:{x:490,y:720,w:390,h:230},
  up:{x:915,y:420,w:230,h:520},
  fly_ul:{x:1095,y:465,w:420,h:470},
};
function buildBm8Frames(){
  if(!img.gk_bm8_sheet)return;
  Object.entries(BM8_FRAME_RECTS).forEach(([name,r])=>{
    const pad=8;
    const o=document.createElement('canvas');o.width=r.w;o.height=r.h;
    const g=o.getContext('2d',{willReadFrequently:true});
    g.drawImage(img.gk_bm8_sheet,r.x,r.y,r.w,r.h,0,0,r.w,r.h);
    const data=g.getImageData(0,0,r.w,r.h), px=data.data;
    for(let i=0;i<px.length;i+=4){
      const rr=px[i],gg=px[i+1],bb=px[i+2];
      const green=gg>125&&rr<110&&bb<110&&(gg-rr)>55&&(gg-bb)>55;
      if(green){px[i+3]=0;continue;}
      const spill=gg>90&&(gg-rr)>26&&(gg-bb)>26;
      if(spill)px[i+1]=Math.min(px[i+1],Math.max(rr,bb)+18);
    }
    g.putImageData(data,0,0);
    const box=trimCanvas(o,pad);
    bm8Frames[name]=box;
  });
}
function trimCanvas(src,pad=8){
  const g=src.getContext('2d',{willReadFrequently:true});
  const {width:w,height:h}=src;
  const data=g.getImageData(0,0,w,h).data;
  let x1=w,y1=h,x2=0,y2=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(data[(y*w+x)*4+3]>8){if(x<x1)x1=x;if(x>x2)x2=x;if(y<y1)y1=y;if(y>y2)y2=y;}
  }
  if(x2<=x1||y2<=y1)return src;
  x1=Math.max(0,x1-pad);y1=Math.max(0,y1-pad);x2=Math.min(w,x2+pad);y2=Math.min(h,y2+pad);
  const o=document.createElement('canvas');o.width=x2-x1;o.height=y2-y1;
  o.getContext('2d').drawImage(src,x1,y1,o.width,o.height,0,0,o.width,o.height);
  return o;
}

// ── Layout ─────────────────────────────────────────────────────────────────
const L={};
function computeLayout(){
  const W=c.width,H=c.height; L.W=W;L.H=H;
  L.br0=Math.min(W,H)*.085;

  // Pick bg: portrait mobile uses bg_mobile.png (750×1624), desktop uses bg.png (1280×720)
  const bgSrc=USE_STREET_CANVAS_SCENE ? null : ((H>W*1.3 && img.bg_mobile) ? img.bg_mobile : img.bg);
  L._bgSrc=bgSrc||null;
  if(bgSrc){
    const bw=bgSrc.naturalWidth, bh=bgSrc.naturalHeight;
    const pm=bh>bw; // portrait mode image
    const zoom=pm?1.2:1.0; // zoom-in 20% extra on portrait
    const s=Math.max(W/bw, H/bh)*zoom;
    const ox=(W-bw*s)/2, oy=(H-bh*s)/2;
    L._bgS=s; L._bgOx=ox; L._bgOy=oy;
    // Goal coords differ by image orientation
    const ix1=pm?148:330, ix2=pm?715:963, iy1=pm?358:228, iy2=pm?650:445;
    L.gx1=Math.max(1,      ox+ix1*s);
    L.gx2=Math.min(W-1,    ox+ix2*s);
    L.gy1=Math.max(1,      oy+iy1*s);
    L.gy2=Math.min(H*.82,  oy+iy2*s);
  } else {
    L.gx1=W*.18; L.gx2=W*.82; L.gy1=H*.22; L.gy2=H*.58;
  }

  L.gw=L.gx2-L.gx1; L.gh=L.gy2-L.gy1;
  L.vpX=(L.gx1+L.gx2)*.5;  // GK centered on goal (not canvas)
  L.bx0=(L.gx1+L.gx2)*.5;  // ball centered on goal
  L.by0=L.gy2+(H-L.gy2)*.50; // ball: midpoint of area below goal
}

// ── PRNG ───────────────────────────────────────────────────────────────────
function prng(s){
  return ()=>{ s|=0;s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return((t^(t>>>14))>>>0)/4294967296; };
}

// ── Pre-rendered caches ────────────────────────────────────────────────────
let bgCache=null, grassCache=null;

function buildBG(){
  const W=c.width,H=c.height;
  const o=document.createElement('canvas');o.width=W;o.height=H;
  const g=o.getContext('2d');
  const horizon=H*.58; // matches L.gy2

  // ── Sky (clean light blue, no clouds) ─────────────────────────────────────
  const sk=g.createLinearGradient(0,0,0,horizon);
  sk.addColorStop(0,'#4aa8d8');
  sk.addColorStop(.45,'#6bbce0');
  sk.addColorStop(.80,'#90cfe8');
  sk.addColorStop(1,'#b8e2f2');
  g.fillStyle=sk; g.fillRect(0,0,W,horizon+2);

  // ── LEFT BUILDING — salmon/pink Mediterranean style ────────────────────────
  const lbW=W*.34, lbH=horizon-H*.02;
  const lbY=H*.02;
  // Main facade — warm salmon/terracotta
  g.fillStyle='#d4614e';
  g.fillRect(0,lbY,lbW,lbH);
  // Left-to-right gradient (light on left, darker right)
  const lbGrad=g.createLinearGradient(0,0,lbW,0);
  lbGrad.addColorStop(0,'rgba(255,200,180,0.12)');
  lbGrad.addColorStop(0.6,'rgba(0,0,0,0)');
  lbGrad.addColorStop(1,'rgba(0,0,0,0.20)');
  g.fillStyle=lbGrad; g.fillRect(0,lbY,lbW,lbH);
  // Top shading
  const lbTop=g.createLinearGradient(0,lbY,0,lbY+H*.12);
  lbTop.addColorStop(0,'rgba(0,0,0,0.25)'); lbTop.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=lbTop; g.fillRect(0,lbY,lbW,H*.12);
  // Rooftop parapet
  g.fillStyle='#c05040';
  g.fillRect(0,lbY,lbW,H*.025);
  g.fillStyle='rgba(255,255,255,0.08)';
  g.fillRect(0,lbY,lbW,H*.012);

  // Windows with shutters (left building)
  const wCols=3, wRows=4;
  const wW=Math.min(lbW*.13,W*.042), wH=H*.062;
  const wPadX=lbW/(wCols+1), wPadY=(lbH-H*.20)/(wRows+1);
  for(let wr=0;wr<wRows;wr++){
    for(let wc=0;wc<wCols;wc++){
      const wx=wPadX*(wc+0.5+0.25)-wW/2;
      const wy=lbY+H*.06+wPadY*(wr+1)-wH/2;
      if(wy+wH>horizon-H*.16) continue;
      // Shutter panels (purple-blue)
      g.fillStyle='#6055a0';
      g.fillRect(wx-wW*.22,wy-wH*.08,wW*.22,wH*1.16);
      g.fillRect(wx+wW,wy-wH*.08,wW*.22,wH*1.16);
      // Window glass
      g.fillStyle='rgba(160,200,235,0.78)';
      g.fillRect(wx,wy,wW,wH);
      // Reflection
      g.fillStyle='rgba(255,255,255,0.22)';
      g.fillRect(wx+wW*.1,wy+wH*.05,wW*.28,wH*.38);
      // Frame
      g.strokeStyle='rgba(50,35,80,0.45)'; g.lineWidth=1;
      g.strokeRect(wx,wy,wW,wH);
      // Sill
      g.fillStyle='rgba(255,255,255,0.15)';
      g.fillRect(wx-wW*.22,wy+wH,wW*1.44,H*.008);
      // Shutter horizontal lines
      g.strokeStyle='rgba(40,25,70,0.35)'; g.lineWidth=0.7;
      for(let sl=1;sl<=4;sl++){
        g.beginPath(); g.moveTo(wx-wW*.22,wy+wH*sl/5); g.lineTo(wx,wy+wH*sl/5); g.stroke();
        g.beginPath(); g.moveTo(wx+wW,wy+wH*sl/5); g.lineTo(wx+wW*1.22,wy+wH*sl/5); g.stroke();
      }
    }
  }
  // Green striped awning at the base of left building
  const awY=horizon-H*.145, awH=H*.095;
  const awStripes=9;
  for(let ai=0;ai<awStripes;ai++){
    const ax=ai*lbW/awStripes;
    g.fillStyle=ai%2===0?'#1e6b22':'#25882a';
    g.beginPath();
    g.moveTo(ax,awY); g.lineTo(ax+lbW/awStripes+1,awY);
    g.lineTo(ax+lbW/awStripes+W*.012,awY+awH);
    g.lineTo(ax-W*.012,awY+awH);
    g.closePath(); g.fill();
  }
  // Awning highlight
  g.fillStyle='rgba(255,255,255,0.12)';
  g.fillRect(0,awY,lbW,awH*.28);
  // Awning shadow underside
  g.fillStyle='rgba(0,0,0,0.18)';
  g.fillRect(0,awY+awH*.72,lbW,awH*.28);

  // ── RIGHT BUILDING — orange-red with cartoon mural ─────────────────────────
  const rbX=W*.66, rbW=W-rbX;
  g.fillStyle='#b84020';
  g.fillRect(rbX,H*.04,rbW,horizon-H*.04);
  // Edge shading
  const rbGrad=g.createLinearGradient(rbX,0,W,0);
  rbGrad.addColorStop(0,'rgba(0,0,0,0.28)'); rbGrad.addColorStop(0.2,'rgba(0,0,0,0)');
  rbGrad.addColorStop(1,'rgba(0,0,0,0.14)');
  g.fillStyle=rbGrad; g.fillRect(rbX,H*.04,rbW,horizon-H*.04);
  // Top shading
  const rbTop=g.createLinearGradient(0,H*.04,0,H*.16);
  rbTop.addColorStop(0,'rgba(0,0,0,0.28)'); rbTop.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rbTop; g.fillRect(rbX,H*.04,rbW,H*.12);
  // Rooftop
  g.fillStyle='#9c3818';
  g.fillRect(rbX,H*.04,rbW,H*.024);
  // MURAL — big cartoon face (Evoplay style)
  const mX=rbX+rbW*.06, mY=H*.10, mW=rbW*.88, mH=horizon-H*.23;
  g.fillStyle='#c84520';
  g.fillRect(mX,mY,mW,mH);
  // Mural border
  g.strokeStyle='rgba(0,0,0,0.20)'; g.lineWidth=2;
  g.strokeRect(mX,mY,mW,mH);
  // Big cartoon face — yellow
  const fcX=mX+mW*.40, fcY=mY+mH*.52, fcR=Math.min(mW,mH)*.32;
  g.fillStyle='#ffd600';
  g.beginPath(); g.arc(fcX,fcY,fcR,0,Math.PI*2); g.fill();
  // Face shadow bottom
  const faceBot=g.createRadialGradient(fcX,fcY+fcR*.3,fcR*.3,fcX,fcY,fcR);
  faceBot.addColorStop(0,'rgba(0,0,0,0)'); faceBot.addColorStop(1,'rgba(0,0,0,0.20)');
  g.fillStyle=faceBot; g.beginPath(); g.arc(fcX,fcY,fcR,0,Math.PI*2); g.fill();
  // Outline
  g.strokeStyle='rgba(80,40,0,0.40)'; g.lineWidth=Math.max(2,W*.004);
  g.beginPath(); g.arc(fcX,fcY,fcR,0,Math.PI*2); g.stroke();
  // Eyes
  g.fillStyle='#1a1a1a';
  g.beginPath(); g.ellipse(fcX-fcR*.38,fcY-fcR*.18,fcR*.17,fcR*.21,-.1,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(fcX+fcR*.38,fcY-fcR*.18,fcR*.17,fcR*.21,.1,0,Math.PI*2); g.fill();
  g.fillStyle='rgba(255,255,255,0.65)';
  g.beginPath(); g.arc(fcX-fcR*.30,fcY-fcR*.27,fcR*.065,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(fcX+fcR*.46,fcY-fcR*.27,fcR*.065,0,Math.PI*2); g.fill();
  // Cheeks
  g.fillStyle='rgba(255,100,80,0.32)';
  g.beginPath(); g.ellipse(fcX-fcR*.60,fcY+fcR*.10,fcR*.22,fcR*.14,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(fcX+fcR*.60,fcY+fcR*.10,fcR*.22,fcR*.14,0,0,Math.PI*2); g.fill();
  // Smile
  g.strokeStyle='#1a1a1a'; g.lineWidth=Math.max(2,W*.005); g.lineCap='round';
  g.beginPath(); g.arc(fcX,fcY+fcR*.08,fcR*.44,Math.PI*.16,Math.PI*.84); g.stroke();
  // Teal abstract blob
  g.fillStyle='rgba(20,180,220,0.42)';
  g.beginPath();
  g.moveTo(mX+mW*.62,mY+mH*.14);
  g.bezierCurveTo(mX+mW*.82,mY+mH*.08,mX+mW*.96,mY+mH*.28,mX+mW*.88,mY+mH*.50);
  g.bezierCurveTo(mX+mW*.80,mY+mH*.68,mX+mW*.60,mY+mH*.58,mX+mW*.58,mY+mH*.38);
  g.closePath(); g.fill();
  // Yellow star
  g.fillStyle='rgba(255,220,0,0.60)';
  const stX=mX+mW*.18, stY=mY+mH*.25, stR=Math.min(mW,mH)*.10;
  g.beginPath();
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5-Math.PI/2; const r=i%2===0?stR:stR*.42;
    i===0?g.moveTo(stX+Math.cos(a)*r,stY+Math.sin(a)*r):g.lineTo(stX+Math.cos(a)*r,stY+Math.sin(a)*r);
  }
  g.closePath(); g.fill();
  // PLAY text
  g.fillStyle='rgba(255,255,255,0.50)';
  g.font=`bold ${Math.round(mH*.16)}px Impact,Arial Black,Arial`;
  g.textAlign='right'; g.textBaseline='bottom';
  g.fillText('PLAY',mX+mW*.97,mY+mH*.98);
  // Blue awning on right building
  const rawY=horizon-H*.14, rawH=H*.095;
  const rawStripes=7;
  for(let ai=0;ai<rawStripes;ai++){
    const ax=rbX+ai*rbW/rawStripes;
    g.fillStyle=ai%2===0?'#1565c0':'#1e88e5';
    g.beginPath();
    g.moveTo(ax,rawY); g.lineTo(ax+rbW/rawStripes+1,rawY);
    g.lineTo(ax+rbW/rawStripes+W*.010,rawY+rawH);
    g.lineTo(ax-W*.010,rawY+rawH);
    g.closePath(); g.fill();
  }
  g.fillStyle='rgba(255,255,255,0.12)';
  g.fillRect(rbX,rawY,rbW,rawH*.28);

  // ── GRAFFITI WALL — center backdrop behind goal ────────────────────────────
  const gwX=W*.17, gwW=W*.66, gwY=H*.20, gwH=horizon-gwY+2;
  // Wall base — purple/lavender like the reference
  g.fillStyle='#7a58a0';
  g.fillRect(gwX,gwY,gwW,gwH);
  // Horizontal gradient for depth
  const gwGrad=g.createLinearGradient(gwX,0,gwX+gwW,0);
  gwGrad.addColorStop(0,'rgba(0,0,0,0.20)'); gwGrad.addColorStop(0.12,'rgba(0,0,0,0)');
  gwGrad.addColorStop(0.88,'rgba(0,0,0,0)'); gwGrad.addColorStop(1,'rgba(0,0,0,0.18)');
  g.fillStyle=gwGrad; g.fillRect(gwX,gwY,gwW,gwH);
  // Top edge shadow
  g.fillStyle='rgba(0,0,0,0.22)'; g.fillRect(gwX,gwY,gwW,3);
  // ── Graffiti: big smiley face (left of center, lower portion) ──────────────
  const gsX=gwX+gwW*.25, gsY=gwY+gwH*.62, gsR=gwH*.28;
  g.fillStyle='#ffd600';
  g.beginPath(); g.arc(gsX,gsY,gsR,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(80,40,0,0.38)'; g.lineWidth=Math.max(1.5,W*.003);
  g.beginPath(); g.arc(gsX,gsY,gsR,0,Math.PI*2); g.stroke();
  g.fillStyle='#111';
  g.beginPath(); g.ellipse(gsX-gsR*.36,gsY-gsR*.18,gsR*.155,gsR*.195,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(gsX+gsR*.36,gsY-gsR*.18,gsR*.155,gsR*.195,0,0,Math.PI*2); g.fill();
  g.fillStyle='rgba(255,255,255,0.60)';
  g.beginPath(); g.arc(gsX-gsR*.27,gsY-gsR*.27,gsR*.058,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(gsX+gsR*.45,gsY-gsR*.27,gsR*.058,0,Math.PI*2); g.fill();
  g.strokeStyle='#111'; g.lineWidth=Math.max(1.5,W*.0035); g.lineCap='round';
  g.beginPath(); g.arc(gsX,gsY+gsR*.06,gsR*.40,Math.PI*.18,Math.PI*.82); g.stroke();
  // Abstract teal shape on wall (upper center-right)
  g.fillStyle='rgba(30,190,230,0.45)';
  g.beginPath();
  g.moveTo(gwX+gwW*.50,gwY+gwH*.12);
  g.bezierCurveTo(gwX+gwW*.68,gwY+gwH*.04,gwX+gwW*.86,gwY+gwH*.18,gwX+gwW*.82,gwY+gwH*.48);
  g.bezierCurveTo(gwX+gwW*.78,gwY+gwH*.68,gwX+gwW*.54,gwY+gwH*.72,gwX+gwW*.48,gwY+gwH*.50);
  g.closePath(); g.fill();
  // Orange accent blob (lower right of wall)
  g.fillStyle='rgba(255,130,0,0.40)';
  g.beginPath();
  g.moveTo(gwX+gwW*.60,gwY+gwH*.60);
  g.lineTo(gwX+gwW*.88,gwY+gwH*.55);
  g.lineTo(gwX+gwW*.90,gwY+gwH*.94);
  g.lineTo(gwX+gwW*.58,gwY+gwH*.95);
  g.closePath(); g.fill();
  // White graffiti outline star (upper left of wall)
  g.strokeStyle='rgba(255,255,255,0.38)'; g.lineWidth=Math.max(1,W*.002); g.lineCap='miter';
  const wstX=gwX+gwW*.14, wstY=gwY+gwH*.28, wstR=gwH*.12;
  g.beginPath();
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5-Math.PI/2; const r=i%2===0?wstR:wstR*.42;
    i===0?g.moveTo(wstX+Math.cos(a)*r,wstY+Math.sin(a)*r):g.lineTo(wstX+Math.cos(a)*r,wstY+Math.sin(a)*r);
  }
  g.closePath(); g.stroke();
  // Pink graffiti squiggle
  g.strokeStyle='rgba(255,80,180,0.38)'; g.lineWidth=Math.max(2,W*.004); g.lineCap='round';
  g.beginPath();
  g.moveTo(gwX+gwW*.32,gwY+gwH*.22);
  g.bezierCurveTo(gwX+gwW*.36,gwY+gwH*.12,gwX+gwW*.44,gwY+gwH*.28,gwX+gwW*.40,gwY+gwH*.36);
  g.bezierCurveTo(gwX+gwW*.36,gwY+gwH*.44,gwX+gwW*.28,gwY+gwH*.42,gwX+gwW*.30,gwY+gwH*.30);
  g.stroke();

  // ── PALM TREE (center-right, behind goal) ──────────────────────────────────
  const ptX=W*.58, ptBase=horizon, ptTop=H*.06;
  const ptTH=ptBase-ptTop;
  // Trunk
  const trkG=g.createLinearGradient(ptX-W*.018,0,ptX+W*.018,0);
  trkG.addColorStop(0,'#5a3515'); trkG.addColorStop(.4,'#8b6535');
  trkG.addColorStop(.68,'#a07840'); trkG.addColorStop(1,'#5a3010');
  g.fillStyle=trkG;
  g.beginPath();
  g.moveTo(ptX-W*.013,ptBase);
  g.quadraticCurveTo(ptX-W*.008,ptBase-.55*ptTH, ptX+W*.009,ptTop+ptTH*.28);
  g.lineTo(ptX+W*.018,ptTop+ptTH*.28);
  g.quadraticCurveTo(ptX+W*.014,ptBase-.55*ptTH, ptX+W*.016,ptBase);
  g.closePath(); g.fill();
  // Trunk rings
  g.strokeStyle='rgba(40,18,5,0.32)'; g.lineWidth=Math.max(1,W*.0025);
  for(let ri=0;ri<14;ri++){
    const ry=ptTop+ptTH*.28+ptTH*.72*ri/14;
    const rx=ptX+W*.003*(ri*.25);
    g.beginPath(); g.moveTo(rx-W*.012,ry); g.quadraticCurveTo(rx+W*.002,ry-ptTH*.009,rx+W*.018,ry); g.stroke();
  }
  // Fronds — clean arcing strokes, no leaflets
  const frondTip=[ptX+W*.01, ptTop+ptTH*.28];
  const fronds=[
    [-115,0.10,0.05], // drooping left-up
    [-85, 0.12,0.06], // mostly straight up
    [-55, 0.16,0.10], // up-left arc
    [-22, 0.14,0.06], // gentle up-right
    [ 20, 0.18,0.11], // arcing right
    [ 55, 0.13,0.14], // drooping right
  ];
  const fColors=['#1b5e20','#2e7d32','#388e3c','#43a047'];
  fronds.forEach(([angDeg,lenFrac,dropFrac],fi)=>{
    const rad=angDeg*Math.PI/180;
    const len=W*lenFrac, drop=H*dropFrac;
    const fx=frondTip[0]+Math.cos(rad)*len, fy=frondTip[1]+Math.sin(rad)*len+drop;
    const mx=frondTip[0]+Math.cos(rad)*len*.5, my=frondTip[1]+Math.sin(rad)*len*.5+drop*.45;
    g.strokeStyle=fColors[fi%fColors.length];
    g.lineWidth=Math.max(3,W*.011); g.lineCap='round';
    g.beginPath(); g.moveTo(frondTip[0],frondTip[1]); g.quadraticCurveTo(mx,my,fx,fy); g.stroke();
    // Minimal leaflets: 3 pairs only, short
    g.lineWidth=Math.max(1.2,W*.0025);
    for(let li=3;li<=6;li++){
      const t=li/8;
      const lx=frondTip[0]*(1-t)+fx*t, ly=frondTip[1]*(1-t)+fy*t;
      const perp=rad+Math.PI/2;
      const side=W*(0.018-t*.005);
      g.beginPath(); g.moveTo(lx,ly); g.lineTo(lx+Math.cos(perp)*side,ly+Math.sin(perp)*side); g.stroke();
      g.beginPath(); g.moveTo(lx,ly); g.lineTo(lx-Math.cos(perp)*side,ly-Math.sin(perp)*side); g.stroke();
    }
  });

  // ── FLAG BUNTING at top ────────────────────────────────────────────────────
  // String line
  g.strokeStyle='rgba(140,110,70,0.55)'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(0,H*.025); g.quadraticCurveTo(W*.5,H*.008,W,H*.025); g.stroke();
  // Triangular pennants
  const pennants=[
    ['#000','#ffd700','#cc0000'],   // Belgium
    ['#003399','#cc0000','#fff'],   // Blue/red/white
    ['#cc0000','#fff',null],        // Red/white
    ['#009c3b','#ffd700',null],     // Green/yellow (Brazil)
    ['#003580','#fff',null],        // Blue/white (Finland-ish)
    ['#cc0000','#006600',null],     // Red/green (Portugal)
    ['#fff','#000099',null],        // White/blue
  ];
  const pCount=pennants.length;
  pennants.forEach((cols,pi)=>{
    const px=(pi+0.5)/pCount*W;
    const pW=W*.05, pH=H*.055;
    const py=H*.018;
    // Draw top 2/3 in first color, bottom third in second
    g.fillStyle=cols[0];
    g.beginPath(); g.moveTo(px-pW/2,py); g.lineTo(px+pW/2,py); g.lineTo(px,py+pH); g.closePath(); g.fill();
    if(cols[1]){
      g.fillStyle=cols[1];
      g.beginPath(); g.moveTo(px-pW/2,py+pH*.42); g.lineTo(px+pW/2,py+pH*.42); g.lineTo(px,py+pH); g.closePath(); g.fill();
    }
    if(cols[2]){
      g.fillStyle=cols[2];
      g.beginPath(); g.moveTo(px-pW/2,py+pH*.68); g.lineTo(px+pW/2,py+pH*.68); g.lineTo(px,py+pH); g.closePath(); g.fill();
    }
    g.strokeStyle='rgba(0,0,0,0.22)'; g.lineWidth=0.7;
    g.beginPath(); g.moveTo(px-pW/2,py); g.lineTo(px+pW/2,py); g.lineTo(px,py+pH); g.closePath(); g.stroke();
  });

  // ── Horizon seam (buildings meet ground) ──────────────────────────────────
  g.fillStyle='rgba(0,0,0,0.28)'; g.fillRect(0,horizon-2,W,4);
  const hzSh=g.createLinearGradient(0,horizon,0,horizon+H*.05);
  hzSh.addColorStop(0,'rgba(0,0,0,0.32)'); hzSh.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=hzSh; g.fillRect(0,horizon,W,H*.05);

  bgCache=o;
}

function buildGrass(){
  if(!L.gy2)return;
  const W=c.width,H=c.height;
  const o=document.createElement('canvas');o.width=W;o.height=H;
  const g=o.getContext('2d');
  const fH=H-L.gy2;

  // ── Green grass pitch ─────────────────────────────────────────────────────
  const grd=g.createLinearGradient(0,L.gy2,0,H*.84);
  grd.addColorStop(0,'#3a9e40');
  grd.addColorStop(.25,'#348c3a');
  grd.addColorStop(.65,'#2d7a32');
  grd.addColorStop(1,'#256828');
  g.fillStyle=grd; g.fillRect(0,L.gy2,W,fH);

  // Mowing stripes (alternating lighter green)
  for(let i=0;i<16;i++){
    const t0=Math.pow(i/16,.52), t1=Math.pow((i+1)/16,.52);
    if(i%2===1){
      g.fillStyle='rgba(255,255,255,0.048)';
      g.fillRect(0,L.gy2+fH*t0,W,Math.max(1,fH*(t1-t0)));
    }
  }

  // Sun highlight on pitch
  const sp=g.createRadialGradient(W*.5,H*.78,0,W*.5,H*.82,W*.50);
  sp.addColorStop(0,'rgba(255,240,160,0.12)'); sp.addColorStop(.45,'rgba(0,0,0,0)'); sp.addColorStop(1,'rgba(0,0,0,0.06)');
  g.fillStyle=sp; g.fillRect(0,L.gy2,W,fH);

  // ── Red/terracotta running track border at the bottom ─────────────────────
  const trackY=H*.864, trackH=H*.078;
  g.fillStyle='#c0392b';
  g.fillRect(0,trackY,W,H-trackY);
  // Track inner highlight
  const trGrad=g.createLinearGradient(0,trackY,0,trackY+trackH);
  trGrad.addColorStop(0,'rgba(255,255,255,0.08)'); trGrad.addColorStop(.5,'rgba(0,0,0,0)'); trGrad.addColorStop(1,'rgba(0,0,0,0.14)');
  g.fillStyle=trGrad; g.fillRect(0,trackY,W,trackH);
  // Track white lane line
  g.strokeStyle='rgba(255,255,255,0.30)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,trackY+trackH*.5); g.lineTo(W,trackY+trackH*.5); g.stroke();
  // Grass-to-track transition
  const gtGrad=g.createLinearGradient(0,trackY-H*.015,0,trackY+H*.015);
  gtGrad.addColorStop(0,'rgba(0,0,0,0)'); gtGrad.addColorStop(1,'rgba(0,0,0,0.18)');
  g.fillStyle=gtGrad; g.fillRect(0,trackY-H*.015,W,H*.03);

  grassCache=o;
}

// ── Game state ─────────────────────────────────────────────────────────────
const TOTAL=5;
const gs={shot:0,goals:0,results:[],streak:0,best:0,histCol:new Array(3).fill(0),histRow:new Array(3).fill(0),busy:false,phase:'idle'};
const MULTS=[2,4,12,20,32];
const econ={bet:100,balance:1000};
const A={ballX:0,ballY:0,ballR:0,spin:0,gkX:0,gkY:0,gkAngle:0,gkScaleX:1,gkScaleY:1,gkPoseT:0,gkPhase:'idle',gkDiveDir:0,gkDiveRow:1,gkSp:'idle',flashZone:-1,flashIsGoal:false,flashAlpha:0,hovered:-1,trail:[],_done:false};
function initAnim(){ A.ballX=L.bx0;A.ballY=L.by0;A.ballR=L.br0;A.gkX=L.gx1+L.gw*.5;A.gkY=0;A.gkAngle=0;A.gkScaleX=1;A.gkScaleY=1;A.gkPoseT=0;A.gkPhase='idle';A.gkDiveDir=0;A.gkDiveRow=1;A.gkSp='idle';A.flashZone=-1;A.flashAlpha=0;A.trail=[]; }

function aiPickCol(){
  const s=gs.histCol.reduce((a,b)=>a+b,0);
  if(s<3||Math.random()>.55)return Math.floor(Math.random()*3);
  let r=Math.random()*s;
  for(let i=0;i<3;i++){r-=gs.histCol[i];if(r<=0)return i;}
  return 0;
}
function aiPickRow(){
  const hi=gs.histRow[0], lo=gs.histRow[1]+gs.histRow[2];
  const total=hi+lo;
  if(total<3) return Math.random()<0.42?0:1;
  if(Math.random()<0.60) return hi>lo?0:1;
  return Math.random()<0.42?0:1;
}
function zoneRect(z){const c2=z%3,r=Math.floor(z/3);return{x:L.gx1+c2*L.gw/3,y:L.gy1+r*L.gh/3,w:L.gw/3,h:L.gh/3};}
function zoneCenter(z){const r=zoneRect(z);return{x:r.x+r.w/2,y:r.y+r.h/2};}
function zoneAt(mx,my){if(mx<L.gx1||mx>L.gx2||my<L.gy1||my>L.gy2)return -1;return Math.min(Math.floor((my-L.gy1)/L.gh*3),2)*3+Math.min(Math.floor((mx-L.gx1)/L.gw*3),2);}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOutBack(t){const c1=1.55,c3=c1+1;return 1+c3*(t-1)**3+c1*(t-1)**2;}
function easeOutCubic(t){return 1-(1-t)**3;}
function gkAnticipation(t){return Math.sin(Math.min(t,1)*Math.PI);}
function gkOvershoot(t){return easeOutBack(Math.min(t,1));}

function shoot(pz){
  if(gs.busy||gs.phase!=='idle'||gs.shot>=TOTAL)return;
  gs.busy=true;
  kickFeedback();
  const pzCol=pz%3, pzRow=Math.floor(pz/3);
  gs.histCol[pzCol]++;gs.histRow[pzRow]++;
  let gkCol,gkRow,isGoal;
  if(Math.random()<0.85){
    // 85% save: GK dives correct column and matching row
    gkCol=pzCol;
    gkRow=pzRow===0?0:1;
    isGoal=false;
  }else{
    // 15% goal: GK dives wrong column
    const wrong=[0,1,2].filter(c=>c!==pzCol);
    gkCol=wrong[Math.floor(Math.random()*wrong.length)];
    gkRow=Math.random()<0.5?0:1;
    isGoal=true;
  }
  const target=zoneCenter(pz);
  const sx=L.bx0,sy=L.by0,sr=L.br0;
  // Dive sprite 440×320 (AR 1.375). Half-width when drawn = gh*ratio*1.375*0.5.
  // Add 12px inward margin so the hand (which extends to the very image edge in
  // the upper-corner sprites) stays inside the goal posts, not on or past them.
  const isTopCorner=gkRow===0 && gkCol!==1;
  const diveRatio=isTopCorner?0.738:0.738;
  const diveHalfW=L.gh*diveRatio*1.375*0.5;
  const handMargin=12;
  const diveLeftFrac=Math.max(0.20, (diveHalfW+handMargin)/L.gw);
  const diveRightFrac=Math.min(0.80, 1-(diveHalfW+handMargin)/L.gw);
  const gkTX=gkCol===0?L.gx1+L.gw*diveLeftFrac:gkCol===2?L.gx1+L.gw*diveRightFrac:L.gx1+L.gw*.5;
  // Top row: corners do an upper-corner flying dive (more upward + steeper tilt),
  // center does a vertical jump. Bottom row stays at ground level.
  const diveDir=gkCol===0?-1:gkCol===2?1:0;
  const gkTY=isTopCorner ? -L.gh*0.48 : (gkRow===0 ? -L.gh*0.28 : L.gh*0.03);
  const baseAng=diveDir<0?-28:diveDir>0?28:0;
  const gkTA=isTopCorner ? Math.sign(baseAng)*48 : baseAng;
  // Lock sprite identity at dive start so we don't swap mid-animation.
  if(isTopCorner) A.gkSp = gkCol===0?'dive_ul':'dive_ur';
  else if(gkCol!==1) A.gkSp = gkCol===0?'dive_l':'dive_r';
  else if(gkRow===0) A.gkSp = 'up';
  else A.gkSp = 'idle';
  A.gkDiveDir=diveDir;A.gkDiveRow=gkRow;A.gkPhase='anticipate';A.gkPoseT=0;
  const gkSX=A.gkX,gkSY=A.gkY;
  gs.phase='flying';document.getElementById('aimHint').style.display='none';A._done=false;A.trail=[];
  let t0=null;const FLY=420,ANT=95,GKD=70,RES=460,RST=1350;
  function step(ts){
    if(!t0)t0=ts;const e=ts-t0;
    const bt=Math.min(e/FLY,1),be=1-(1-bt)**2;
    A.ballX=lerp(sx,target.x,be);A.ballY=lerp(sy,target.y,be);A.ballR=lerp(sr,sr*.40,be);A.spin+=.18;
    if(e<FLY){A.trail.push({x:A.ballX,y:A.ballY,r:A.ballR,a:.55});if(A.trail.length>12)A.trail.shift();}
    if(e<GKD+ANT){
      const crouch=gkAnticipation(e/(GKD+ANT));
      A.gkX=gkSX-diveDir*L.gw*.018*crouch;
      A.gkY=L.gh*.035*crouch;
      A.gkAngle=-diveDir*6*crouch;
      A.gkScaleX=1+.10*crouch;
      A.gkScaleY=1-.12*crouch;
      A.gkPhase='anticipate';A.gkPoseT=crouch;
    }else{
      const gt=Math.min((e-GKD-ANT)/(FLY-GKD-ANT),1),ge=gkOvershoot(gt);
      const arc=Math.sin(Math.min(gt,1)*Math.PI);
      A.gkX=lerp(gkSX,gkTX,ge);
      A.gkY=lerp(gkSY,gkTY,ge)-arc*L.gh*(isTopCorner?.11:.06);
      A.gkAngle=lerp(-diveDir*6,gkTA,Math.min(ge,1));
      A.gkScaleX=1+.12*(1-gt);
      A.gkScaleY=1-.08*(1-gt);
      A.gkPhase=gt>.82?'land':'dive';A.gkPoseT=gt;
    }
    if(e>=RES){A.flashZone=pz;A.flashIsGoal=isGoal;A.flashAlpha=Math.min((e-RES)/150,1);}
    if(e>=RES&&!A._done){
      A._done=true;
      if(isGoal){gs.goals++;gs.streak++;if(gs.streak>gs.best)gs.best=gs.streak;showMsg('⚽  进球！','#ffeb3b','goal-pop');document.getElementById('streakBadge').textContent=gs.streak>=3?`🔥 ${gs.streak} 连击！`:'';}
      else{gs.streak=0;showMsg('🙅  被扑出！','#ff6060','save-pop');document.getElementById('streakBadge').textContent='';}
      gs.results.push(isGoal?'goal':'miss');gs.shot++;renderPips();renderHUD();
    }
    if(e>=RST){
      A.flashZone=-1;A.flashAlpha=0;A._done=false;
      A.gkX=L.gx1+L.gw*.5;A.gkY=0;A.gkAngle=0;A.gkScaleX=1;A.gkScaleY=1;A.gkPoseT=0;A.gkPhase='idle';A.gkDiveDir=0;A.gkSp='idle';
      A.ballX=L.bx0;A.ballY=L.by0;A.ballR=L.br0;
      hideMsg();gs.phase='idle';gs.busy=false;
      if(gs.shot>=TOTAL)setTimeout(showResult,200);else document.getElementById('aimHint').style.display='';
      return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ── Draw helpers ───────────────────────────────────────────────────────────
function rr(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ── Draw: field ────────────────────────────────────────────────────────────
function drawField(){
  const{W,H,gy2,gx1,gx2,gw,vpX}=L,fH=H-gy2;
  // Skip canvas-drawn grass when custom bg.png is loaded (bg already contains pitch)
  if(!img.bg && grassCache)ctx.drawImage(grassCache,0,0);
  ctx.strokeStyle='rgba(255,255,255,0.52)';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(0,gy2);ctx.lineTo(W,gy2);ctx.stroke();
  const paL=gx1-gw*.08,paR=gx2+gw*.08,sp=2.2;
  const bL=vpX+(paL-vpX)*sp,bR=vpX+(paR-vpX)*sp;
  const nt=.38,ny=gy2+fH*nt,nL=lerp(paL,bL,nt),nR=lerp(paR,bR,nt);
  ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(paL,gy2);ctx.lineTo(bL,H*.86);ctx.moveTo(paR,gy2);ctx.lineTo(bR,H*.86);ctx.moveTo(nL,ny);ctx.lineTo(nR,ny);ctx.stroke();
  if(!img.bg){ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.beginPath();ctx.arc(vpX,gy2+fH*.08,5.5,0,Math.PI*2);ctx.fill();}
}

// ── Draw: goal back (transparent — shows graffiti wall through net) ─────────
function drawGoalBack(){
  const{gx1,gx2,gy1,gy2,gw,gh}=L;
  const dep=gw*.055,bx1=gx1+dep,bx2=gx2-dep,by1=gy1+dep*.40,by2=gy2-dep*.06;
  // Subtle depth shadow — no opaque fill
  const depG=ctx.createLinearGradient(0,gy1,0,gy2);
  depG.addColorStop(0,'rgba(0,0,0,0.40)');
  depG.addColorStop(.45,'rgba(0,0,0,0.22)');
  depG.addColorStop(1,'rgba(0,0,0,0.05)');
  ctx.fillStyle=depG; ctx.fillRect(gx1,gy1,gw,gh);
  // Back wall shadow
  ctx.fillStyle='rgba(0,0,0,0.24)';
  ctx.beginPath();ctx.moveTo(bx1,by1);ctx.lineTo(bx2,by1);ctx.lineTo(bx2,by2);ctx.lineTo(bx1,by2);ctx.closePath();ctx.fill();
  // Corner depth lines
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1.5;
  [[gx1,gy1,bx1,by1],[gx2,gy1,bx2,by1],[gx1,gy2,bx1,by2],[gx2,gy2,bx2,by2]].forEach(([ax,ay,ex,ey])=>{ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ex,ey);ctx.stroke();});
  // Side net lines
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=0.7;
  for(let i=1;i<6;i++){
    const t=i/6,fy=gy1+(gy2-gy1)*t,by=by1+(by2-by1)*t;
    ctx.beginPath();ctx.moveTo(gx1,fy);ctx.lineTo(bx1,by);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gx2,fy);ctx.lineTo(bx2,by);ctx.stroke();
  }
  for(let i=1;i<5;i++){
    const t=i/5,fx=gx1+gw*t,bx=bx1+(bx2-bx1)*t;
    ctx.beginPath();ctx.moveTo(fx,gy1);ctx.lineTo(bx,by1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx,gy2);ctx.lineTo(bx,by2);ctx.stroke();
  }
  // Back wall grid
  ctx.strokeStyle='rgba(255,255,255,0.24)';ctx.lineWidth=0.55;
  for(let i=0;i<=7;i++){
    const y=by1+(i/7)*(by2-by1);ctx.beginPath();ctx.moveTo(bx1,y);ctx.lineTo(bx2,y);ctx.stroke();
    const x=bx1+(i/7)*(bx2-bx1);ctx.beginPath();ctx.moveTo(x,by1);ctx.lineTo(x,by2);ctx.stroke();
  }
}

// ── Draw: goal front net ───────────────────────────────────────────────────
function drawGoalFront(){
  const{gx1,gx2,gy1,gy2,gw,gh}=L;
  ctx.strokeStyle='rgba(255,255,255,0.38)';ctx.lineWidth=0.8;
  for(let i=0;i<=10;i++){const y=gy1+(i/10)*gh;ctx.beginPath();ctx.moveTo(gx1,y);ctx.lineTo(gx2,y);ctx.stroke();}
  for(let i=0;i<=18;i++){const x=gx1+(i/18)*gw;ctx.beginPath();ctx.moveTo(x,gy1);ctx.lineTo(x,gy2);ctx.stroke();}
}

// ── Draw: goal posts — white metallic (like the reference) ────────────────
function drawGoalPosts(){
  const{gx1,gx2,gy1,gy2}=L,pw=14,sh=5;
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.fillRect(gx1-pw/2+sh,gy1+sh,pw,gy2-gy1);
  ctx.fillRect(gx2-pw/2+sh,gy1+sh,pw,gy2-gy1);
  ctx.fillRect(gx1-pw/2+sh,gy1+sh,gx2-gx1+pw,pw);
  function post(x,y,w,h){
    const gl=ctx.createLinearGradient(x,0,x+w,0);
    gl.addColorStop(0,'#888');gl.addColorStop(.18,'#d8d8d8');gl.addColorStop(.36,'#f4f4f4');
    gl.addColorStop(.50,'#ffffff');gl.addColorStop(.64,'#f0f0f0');gl.addColorStop(.82,'#d0d0d0');gl.addColorStop(1,'#909090');
    ctx.fillStyle=gl;ctx.fillRect(x,y,w,h);
  }
  function crossbar(x,y,w,h){
    const gl=ctx.createLinearGradient(0,y,0,y+h);
    gl.addColorStop(0,'#888');gl.addColorStop(.22,'#d8d8d8');gl.addColorStop(.46,'#f8f8f8');
    gl.addColorStop(.54,'#ffffff');gl.addColorStop(.78,'#d0d0d0');gl.addColorStop(1,'#909090');
    ctx.fillStyle=gl;ctx.fillRect(x,y,w,h);
  }
  post(gx1-pw/2,gy1,pw,gy2-gy1);
  post(gx2-pw/2,gy1,pw,gy2-gy1);
  crossbar(gx1-pw/2,gy1,gx2-gx1+pw,pw);
  // End caps
  ctx.fillStyle='#bbb';
  ctx.beginPath();ctx.arc(gx1,gy2,pw/2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(gx2,gy2,pw/2,0,Math.PI*2);ctx.fill();
}

// ── Draw: goalkeeper — image-aware ────────────────────────────────────────
function drawGK(){
  if(USE_STREET_CANVAS_SCENE && bm8Frames.idle) return drawBm8GK();
  // Sprite locked at dive start (A.gkSp). Stay idle until motion actually
  // begins so the dive pose appears at the same instant the body starts moving.
  let sp=null, isCornerDive=false;
  const hasMoved=A.gkY!==0 || A.gkAngle!==0 || A.gkPhase!=='idle';
  const want=gkSpriteForPhase(hasMoved);
  const fallbacks={
    dive_ul:[img.gk_up_left,img.gk_left,img.gk_idle],
    dive_ur:[img.gk_up_right,img.gk_right,img.gk_idle],
    dive_l: [img.gk_left,img.gk_idle],
    dive_r: [img.gk_right,img.gk_idle],
    up:     [img.gk_up,img.gk_idle],
    idle:   [img.gk_idle],
  };
  for(const cand of (fallbacks[want]||fallbacks.idle)){ if(cand){sp=cand;break;} }
  isCornerDive=(sp===img.gk_up_left||sp===img.gk_up_right);
  if(sp){
    const stage=gkStage();
    let gkHRatio=1.08;
    if(sp===img.gk_left||sp===img.gk_right||sp===img.gk_up_left||sp===img.gk_up_right) gkHRatio=0.738;
    else if(sp===img.gk_up) gkHRatio=0.918;
    gkHRatio*=stage.size;
    const gkH=L.gh*gkHRatio, gkW=gkH*sp.width/sp.height;
    ctx.save();
    // Center GK body (head→feet) at goal vertical midpoint
    const gkAnchor=(L.gy1+L.gy2)/2+gkH*0.41;
    ctx.translate(A.gkX+stage.x, gkAnchor+A.gkY+stage.y);
    // Dedicated upper-corner sprites already have tilt baked in — skip rotation
    if(!isCornerDive) ctx.rotate((A.gkAngle+stage.angle)*Math.PI/180);
    ctx.scale((A.gkScaleX||1)*stage.sx,(A.gkScaleY||1)*stage.sy);
    // Ground shadow
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath();ctx.ellipse(0,0,gkW*.38,gkH*.04,0,0,Math.PI*2);ctx.fill();
    // Sprites have ~18% transparent padding below the feet.
    // Shift draw up so the feet (at ~82% of image height) land at anchor (y=0).
    ctx.drawImage(sp,-gkW/2,-gkH*0.82,gkW,gkH);
    ctx.restore();
    return;
  }
  drawGKCanvas(); // fallback
}

function bm8FrameForPhase(){
  if(A.gkPhase==='anticipate')return A.gkDiveRow===0?'up':'crouch';
  if(A.gkPhase==='land')return A.gkDiveRow===0?'fly_ul':'land_l';
  if(A.gkPhase==='dive'){
    if(A.gkDiveRow===0&&A.gkDiveDir===0)return 'up';
    if(A.gkDiveRow===0)return 'fly_ul';
    return A.gkPoseT>.52?'fly_l_2':'fly_l_1';
  }
  return 'idle';
}
function drawBm8GK(){
  const key=bm8FrameForPhase();
  const frame=bm8Frames[key]||bm8Frames.idle;
  const stage=gkStage();
  const flip=(A.gkDiveDir||0)>0 && key!=='idle' && key!=='crouch' && key!=='up';
  const frameScale=key==='idle'?1.15:key==='crouch'?1.02:key==='up'?1.18:key==='land_l'?0.78:0.92;
  let h=L.gh*frameScale*stage.size;
  let w=h*frame.width/frame.height;
  const anchor=(L.gy1+L.gy2)/2+L.gh*.46;
  ctx.save();
  ctx.translate(A.gkX+stage.x,anchor+A.gkY+stage.y);
  ctx.rotate((A.gkAngle+stage.angle)*Math.PI/180);
  ctx.scale((flip?-1:1)*(A.gkScaleX||1)*stage.sx,(A.gkScaleY||1)*stage.sy);
  ctx.fillStyle='rgba(0,0,0,.24)';
  ctx.beginPath();ctx.ellipse(0,6,w*.28,h*.035,0,0,Math.PI*2);ctx.fill();
  const yOffset=key==='land_l'?-h*.42:key==='fly_l_1'||key==='fly_l_2'||key==='fly_ul'?-h*.50:-h*.72;
  ctx.drawImage(frame,-w/2,yOffset,w,h);
  ctx.restore();
}

function gkSpriteForPhase(hasMoved){
  if(A.gkPhase==='anticipate') return A.gkDiveRow===0?'up':'idle';
  if(A.gkPhase==='land') return A.gkSp||'idle';
  return hasMoved ? (A.gkSp||'idle') : 'idle';
}

function gkStage(){
  const dir=A.gkDiveDir||0,t=A.gkPoseT||0;
  if(A.gkPhase==='anticipate'){
    const c=gkAnticipation(t);
    return {x:-dir*L.gw*.018*c,y:L.gh*.030*c,angle:-dir*5*c,sx:1+.08*c,sy:1-.10*c,size:1};
  }
  if(A.gkPhase==='dive'){
    const snap=Math.sin(Math.min(t,1)*Math.PI);
    return {x:dir*L.gw*.012*snap,y:-L.gh*.018*snap,angle:dir*4*snap,sx:1+.04*(1-t),sy:1-.03*(1-t),size:1+.035*snap};
  }
  if(A.gkPhase==='land'){
    const l=Math.min((t-.82)/.18,1);
    return {x:0,y:L.gh*.022*l,angle:-dir*5*l,sx:1+.06*l,sy:1-.06*l,size:1};
  }
  return {x:0,y:0,angle:0,sx:1,sy:1,size:1};
}

function drawAnimatedGK(){
  const dir=A.gkDiveDir||0, t=A.gkPoseT||0, diving=A.gkPhase==='dive'||A.gkPhase==='land';
  const sideDive=diving&&dir!==0;
  const upDive=diving&&dir===0&&A.gkDiveRow===0;
  const sc=L.gh/230;
  const anchor=(L.gy1+L.gy2)/2+L.gh*.43;
  const crouch=A.gkPhase==='anticipate'?t:0;
  const flight=diving?Math.min(t,1):0;
  const land=A.gkPhase==='land'?Math.min((t-.82)/.18,1):0;
  ctx.save();
  ctx.translate(A.gkX,anchor+A.gkY);
  ctx.rotate(A.gkAngle*Math.PI/180);
  ctx.scale(sc*(A.gkScaleX||1),sc*(A.gkScaleY||1));

  const lean=sideDive?dir*(26+18*flight):dir*-8*crouch;
  const torsoY=-72+18*crouch-8*Math.sin(flight*Math.PI);
  const headY=torsoY-38-6*flight;
  const shoulderY=torsoY-22;
  const hipY=torsoY+27;
  const shoulderL={x:-20,y:shoulderY}, shoulderR={x:20,y:shoulderY};
  const hipL={x:-13,y:hipY}, hipR={x:13,y:hipY};

  let gloveL={x:-58,y:-58}, gloveR={x:58,y:-58};
  let footL={x:-24,y:-3}, footR={x:24,y:-3};
  if(crouch){
    gloveL={x:-54-dir*10*crouch,y:-44+16*crouch};
    gloveR={x:54-dir*10*crouch,y:-44+16*crouch};
    footL={x:-30-dir*7*crouch,y:0};
    footR={x:30-dir*7*crouch,y:0};
  }
  if(sideDive){
    const reach=120*flight;
    gloveL={x:dir>0?28+reach:-78-reach*.18,y:-65-34*flight};
    gloveR={x:dir>0?58+reach:-28-reach,y:-69-38*flight};
    footL={x:-18-dir*86*flight,y:-4+32*flight+10*land};
    footR={x:24-dir*62*flight,y:12+44*flight+10*land};
  }else if(upDive){

    footR={x:22,y:2+18*flight};

  ctx.fillStyle='rgba(0,0,0,.28)';

  function drawLimb(a,b,c,w,col){

    const gg=ctx.createLinearGradient(-15,-10,16,12);

    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-10,-5+i*5);ctx.lineTo(11,-5+i*5);ctx.stroke();}

  }

  ctx.save();ctx.rotate(lean*Math.PI/180);
  drawLimb(shoulderL,{x:-48-dir*14*flight,y:-50-20*flight},gloveL,13,'#1f8fe5');
  drawLimb(shoulderR,{x:48+dir*14*flight,y:-50-20*flight},gloveR,13,'#1f8fe5');

  ctx.beginPath();

  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(-21,torsoY-14,42,6);
  ctx.fillStyle='rgba(255,255,255,.86)';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('1',0,torsoY+4);
  ctx.fillStyle='#101037';ctx.beginPath();ctx.moveTo(-20,torsoY+26);ctx.lineTo(20,torsoY+26);ctx.lineTo(15,torsoY+54);ctx.lineTo(-15,torsoY+54);ctx.closePath();ctx.fill();

  ctx.fillStyle='#d69b5f';ctx.beginPath();ctx.arc(0,headY,17,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#20100a';ctx.beginPath();ctx.ellipse(0,headY-11,18,9,0,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-6,headY-1,2.2,0,Math.PI*2);ctx.arc(6,headY-1,2.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(80,30,20,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,headY+8);ctx.quadraticCurveTo(0,headY+11,6,headY+8);ctx.stroke();
  ctx.restore();

  glove(gloveL,true);glove(gloveR,false);
  ctx.fillStyle='#09091b';
  [footL,footR].forEach((p,i)=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate((i?0.15:-0.15)-dir*.45*flight);ctx.beginPath();ctx.ellipse(0,0,17,7,0,0,Math.PI*2);ctx.fill();ctx.restore();});
  ctx.restore();
}

// ── Draw: ball — image-aware ───────────────────────────────────────────────
function drawBall(){
  const x=A.ballX,y=A.ballY,r=A.ballR;
  // Shadow (always)
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(x,y+r*.88,r*.72,r*.20,0,0,Math.PI*2);ctx.fill();
  if(img.ball){
    ctx.save();ctx.translate(x,y);ctx.rotate(A.spin);
    // Maintain aspect ratio — AI-generated images are often 1536×1024 (3:2), not square
    const bAR=img.ball.naturalWidth/img.ball.naturalHeight;
    const bW=r*2*Math.max(1,bAR), bH=r*2*Math.max(1,1/bAR);
    ctx.drawImage(img.ball,-bW/2,-bH/2,bW,bH);
    ctx.restore();
    return;
  }
  drawBallCanvas();
}
function drawBallTrail(){
  if(!A.trail.length)return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<A.trail.length;i++){
    const p=A.trail[i], t=(i+1)/A.trail.length;
    ctx.fillStyle=`rgba(255,230,120,${p.a*t*.55})`;
    ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*(.55+t*.18),p.r*(.24+t*.10),A.spin*.25,0,Math.PI*2);ctx.fill();
    p.a*=.90;
  }
  ctx.restore();
  A.trail=A.trail.filter(p=>p.a>.035);
}
function drawBallCanvas(){
  const x=A.ballX,y=A.ballY,r=A.ballR;
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  const bg=ctx.createRadialGradient(x-r*.32,y-r*.32,r*.04,x,y,r);
  bg.addColorStop(0,'#fff');bg.addColorStop(.42,'#e0e0e0');bg.addColorStop(1,'#707070');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a1a';
  function pent(cx,cy,pr,sp){ctx.beginPath();for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2+sp;i===0?ctx.moveTo(cx+Math.cos(a)*pr,cy+Math.sin(a)*pr):ctx.lineTo(cx+Math.cos(a)*pr,cy+Math.sin(a)*pr);}ctx.closePath();ctx.fill();}
  pent(x,y,r*.23,A.spin);
  for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2+A.spin*.4;pent(x+Math.cos(a)*r*.53,y+Math.sin(a)*r*.53,r*.23,A.spin+i);}
  const sh=ctx.createRadialGradient(x-r*.28,y-r*.33,0,x,y,r);
  sh.addColorStop(0,'rgba(255,255,255,0.65)');sh.addColorStop(.45,'rgba(255,255,255,0.10)');sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── Draw: zones ────────────────────────────────────────────────────────────
function drawZones(){
  if(A.hovered>=0&&gs.phase==='idle'){
    const{gx1,gx2,gy1,gy2,gw,gh}=L;
    ctx.strokeStyle='rgba(255,255,100,0.30)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(gx1+gw/3*i,gy1);ctx.lineTo(gx1+gw/3*i,gy2);ctx.stroke();ctx.beginPath();ctx.moveTo(gx1,gy1+gh/3*i);ctx.lineTo(gx2,gy1+gh/3*i);ctx.stroke();}
    ctx.setLineDash([]);
    const rz=zoneRect(A.hovered);
    ctx.fillStyle='rgba(255,255,100,0.16)';ctx.fillRect(rz.x,rz.y,rz.w,rz.h);
    const cx2=rz.x+rz.w/2,cy2=rz.y+rz.h/2,cr=Math.min(rz.w,rz.h)*.25;
    ctx.strokeStyle='rgba(255,255,100,0.95)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx2,cy2,cr,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx2-cr*1.5,cy2);ctx.lineTo(cx2-cr*.6,cy2);ctx.moveTo(cx2+cr*.6,cy2);ctx.lineTo(cx2+cr*1.5,cy2);ctx.moveTo(cx2,cy2-cr*1.5);ctx.lineTo(cx2,cy2-cr*.6);ctx.moveTo(cx2,cy2+cr*.6);ctx.lineTo(cx2,cy2+cr*1.5);ctx.stroke();
  }
  if(A.flashZone>=0&&A.flashAlpha>0){
    const rz=zoneRect(A.flashZone);
    const cx=rz.x+rz.w/2, cy=rz.y+rz.h/2;
    const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rz.w,rz.h)*.72);
    if(A.flashIsGoal){
      glow.addColorStop(0,`rgba(255,235,59,${A.flashAlpha*.70})`);
      glow.addColorStop(.55,`rgba(0,230,118,${A.flashAlpha*.35})`);
      glow.addColorStop(1,'rgba(0,230,118,0)');
    }else{
      glow.addColorStop(0,`rgba(255,255,255,${A.flashAlpha*.34})`);
      glow.addColorStop(.45,`rgba(255,50,50,${A.flashAlpha*.42})`);
      glow.addColorStop(1,'rgba(255,50,50,0)');
    }
    ctx.fillStyle=glow;
    ctx.fillRect(rz.x,rz.y,rz.w,rz.h);
    ctx.strokeStyle=A.flashIsGoal?`rgba(255,235,59,${A.flashAlpha})`:`rgba(255,255,255,${A.flashAlpha*.8})`;
    ctx.lineWidth=4;
    ctx.strokeRect(rz.x+3,rz.y+3,rz.w-6,rz.h-6);
  }
}

// ── Post-processing: gentle outdoor vignette ───────────────────────────────
function drawVignette(){
  const{W,H}=L;
  const vg=ctx.createRadialGradient(W*.5,H*.46,H*.22,W*.5,H*.50,H*.74);
  vg.addColorStop(0,'rgba(255,255,255,0.03)');vg.addColorStop(.70,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.22)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

// ── Neon post overlay (mobile portrait, bg.png side posts are off-screen) ──
function drawNeonPosts(){
  const{gx1,gx2,gy1,gy2}=L;
  ctx.save();
  // Thin neon tube lines matching bg.png post style
  ctx.shadowColor='rgba(255,60,0,0.95)';
  ctx.shadowBlur=22;
  ctx.strokeStyle='rgba(255,90,20,0.92)';
  ctx.lineWidth=5;
  ctx.lineCap='square';
  ctx.beginPath();
  ctx.moveTo(gx1+2.5,gy1); ctx.lineTo(gx1+2.5,gy2); // left post
  ctx.moveTo(gx2-2.5,gy1); ctx.lineTo(gx2-2.5,gy2); // right post
  ctx.stroke();
  // Bright inner core highlight
  ctx.shadowBlur=6;
  ctx.strokeStyle='rgba(255,210,150,0.75)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.restore();
}

// ── Render loop ────────────────────────────────────────────────────────────
function draw(){
  // Background: bg_mobile (portrait) > bg (landscape) > canvas cache
  if(L._bgSrc){
    ctx.drawImage(L._bgSrc,L._bgOx,L._bgOy,L._bgSrc.naturalWidth*L._bgS,L._bgSrc.naturalHeight*L._bgS);
  } else if(bgCache) ctx.drawImage(bgCache,0,0);
  const hasBg=!!L._bgSrc;
  if(!hasBg) drawField();
  if(!hasBg) drawGoalBack();
  drawGK();
  if(!hasBg) drawGoalFront();
  if(!hasBg) drawGoalPosts();
  // Draw neon posts only when using landscape bg.png on a portrait screen (posts off-screen)
  if(hasBg && L.H>L.W*1.3 && !img.bg_mobile) drawNeonPosts();
  drawZones();
  drawBallTrail();
  drawBall();
  drawVignette();
  requestAnimationFrame(draw);
}

function currentWin(){

}
function renderPips(){

  document.getElementById('multRail').innerHTML=MULTS.map((m,i)=>{
    const r=gs.results[i];
    const cls=r==='goal'?'won':r==='miss'?'lost':i===gs.shot?'active':'';
    return `<div class="multStep ${cls}">x${m}</div>`;
  }).join('');
}
function renderHUD(){
  document.getElementById('hGoals').textContent=gs.goals;
  document.getElementById('hStreak').textContent=gs.streak;
  document.getElementById('hBest').textContent=gs.best;
  document.getElementById('betValue').textContent=money(econ.bet);
  document.getElementById('balanceValue').textContent=money(econ.balance+currentWin());
  const collect=document.getElementById('collectBtn');
  collect.disabled=currentWin()<=0||gs.busy;
  collect.textContent=currentWin()>0?`COLLECT ${money(currentWin())}`:'COLLECT';
}
function showResult(){
  const g=gs.goals,win=currentWin(),[e,t,f]=g===5?['🏆','完美街头射手！','倍率拉满，门将被你晃到怀疑人生']:g>=4?['🎉','高光表现！','连续命中，节奏非常漂亮']:g>=3?['👍','不错的路线！','再压一点死角就能爆发']:g>=2?['😅','还差一点火候','门将读到了你的节奏']:['😭','被门将统治','换个角度再来一轮'];
  document.getElementById('mEmoji').textContent=e;document.getElementById('mTitle').textContent=t;document.getElementById('mScore').textContent=`${g} / ${TOTAL} 球 · DEMO WIN ${money(win)}`;document.getElementById('mFlavor').textContent=f;document.getElementById('overlay').classList.add('open');
}
function restart(){
  gs.shot=0;gs.goals=0;gs.results=[];gs.streak=0;gs.busy=false;gs.phase='idle';
  gs.histCol=[0,0,0];gs.histRow=[0,0,0];
  document.getElementById('overlay').classList.remove('open');document.getElementById('streakBadge').textContent='';document.getElementById('aimHint').style.display='';
  hideMsg();initAnim();renderPips();renderHUD();
}
function collectDemo(){
  const win=currentWin();
  if(win<=0||gs.busy)return;
  econ.balance+=win;
  showMsg(`COLLECT ${money(win)}`,'#00e676','goal-pop');
  restart();
}
function changeBet(delta){
  if(gs.shot>0||gs.busy)return;
  econ.bet=Math.max(20,Math.min(500,econ.bet+delta));
  renderHUD();
}

// ── Input ──────────────────────────────────────────────────────────────────
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*c.width/r.width,my=(e.clientY-r.top)*c.height/r.height;A.hovered=gs.phase==='idle'?zoneAt(mx,my):-1;c.style.cursor=(A.hovered>=0&&gs.phase==='idle')?'crosshair':'default';});
c.addEventListener('click',e=>{if(gs.phase!=='idle')return;const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*c.width/r.width,my=(e.clientY-r.top)*c.height/r.height;const z=zoneAt(mx,my);if(z>=0)shoot(z);});
c.addEventListener('touchstart',e=>{e.preventDefault();if(gs.phase!=='idle')return;const t=e.changedTouches[0],r=c.getBoundingClientRect(),mx=(t.clientX-r.left)*c.width/r.width,my=(t.clientY-r.top)*c.height/r.height;const z=zoneAt(mx,my);if(z>=0)shoot(z);},{passive:false});
document.getElementById('collectBtn').addEventListener('click',collectDemo);
document.getElementById('betDown').addEventListener('click',()=>changeBet(-20));
document.getElementById('betUp').addEventListener('click',()=>changeBet(20));

// ── Init ───────────────────────────────────────────────────────────────────
function resize(){
  c.width=document.documentElement.clientWidth;c.height=document.documentElement.clientHeight;
  computeLayout();buildBG();buildGrass();initAnim();
}
window.addEventListener('resize',resize);

// ── Background music ──────────────────────────────────────────────────────
// Drop your MP3 at  assets/bgm.mp3  (e.g. World Cup theme song you legally own).
// If the file is missing the button just stays muted — the game still works.
const bgm=document.getElementById('bgm'), musicBtn=document.getElementById('musicBtn');
let bgmOn=false, bgmReady=false;
bgm.volume=0.45;
bgm.addEventListener('canplay',()=>{bgmReady=true;});
bgm.addEventListener('error',()=>{musicBtn.style.opacity='0.35';musicBtn.title='assets/bgm.mp3 未找到';});
function toggleBGM(){
  if(!bgmReady && bgm.error){return;}
  if(bgmOn){bgm.pause();musicBtn.textContent='🔇';bgmOn=false;}
  else{bgm.play().then(()=>{musicBtn.textContent='🔊';bgmOn=true;}).catch(()=>{});}
}
musicBtn.addEventListener('click',toggleBGM);

function startBGM(){
  if(!bgmOn&&bgmReady&&!bgm.error){
    bgm.play().then(()=>{musicBtn.textContent='🔊';bgmOn=true;}).catch(()=>{});
  }
}

// Load assets → show "start" button → tap starts game + music
loadAssets(()=>{
  try{buildBm8Frames();}catch(err){console.error(err);const h=document.getElementById('lsHint');if(h)h.textContent='BM8 门将帧处理失败，已使用备用门将：'+err.message;}
  const lsTxt=document.querySelector('#loadScreen .ls-txt');
  const lsHint=document.getElementById('lsHint');
  const lsBar=document.querySelector('.ls-bar');
  const startBtn=document.getElementById('startBtn');
  if(lsTxt)lsTxt.textContent='准备好了！';
  if(lsHint)lsHint.style.display='none';
  if(lsBar)lsBar.style.display='none';
  if(startBtn)startBtn.style.display='';
  const go=()=>{
    document.getElementById('loadScreen').classList.add('hidden');
    resize();renderPips();renderHUD();draw();
    startBGM();
  };
  if(startBtn){
    startBtn.addEventListener('click',go);
    startBtn.addEventListener('touchend',e=>{e.preventDefault();go();},{passive:false});
  }
});
</script>
</body>
</html>
